<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Café Brief · 新品上架 Agent</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/launch/launch.css">
  <script type="module" src="/launch/app.mjs"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><img src="/assets/favicon.svg" width="28" height="28" alt=""><strong>Café Brief</strong></div>
      <nav class="top-links" aria-label="工作区"><a href="/" aria-current="page">新品上架</a><a href="/workbench">原包装工作台</a></nav>
      <span class="model-status" id="modelStatus" role="status">本地工作区</span>
    </div>
  </header>
  <main>
    <header class="page-header">
      <div><h1>新品上架 Agent</h1><p>交一张商品照和一段备注，核对后生成整套渠道物料。</p></div>
      <span id="saved" class="quiet" role="status"></span>
    </header>
    <nav class="stepper" aria-label="新品上架进度">
      <ol>
        <li id="step-intake" aria-current="step"><span>1</span>提交素材</li>
        <li id="step-facts"><span>2</span>核对信息</li>
        <li id="step-review"><span>3</span>审稿打包</li>
      </ol>
    </nav>
    <p id="notice" class="notice" role="status"></p>

    <section id="intake" class="layout intake" aria-labelledby="intakeTitle">
      <form id="brief" class="panel stack" method="post" action="/api/launch/extract" aria-labelledby="intakeTitle">
        <div><h2 id="intakeTitle" tabindex="-1">提交新品素材</h2><p>备注里写上已有的信息，缺项留到下一步补。</p></div>
        <div class="field"><label for="photo">商品照片</label><input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photoState">
          <small id="photoState" role="status">支持 JPG、PNG、WebP，最大 15 MB。</small></div>
        <div class="field"><label for="note">上新备注</label><textarea id="note" name="note" rows="4" maxlength="1200" required placeholder="例如：周五上冰奶油拿铁，28 元，仅限堂食。"></textarea></div>
        <div class="row"><button class="primary" type="submit">整理商品信息</button><button id="manual" type="button">手动填写</button><button id="sample" type="button">载入示例</button></div>
      </form>
      <figure class="panel photo-panel">
        <img id="photoPreview" alt="当前商品原片" hidden>
        <div id="photoEmpty" class="photo-empty">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m3 17 5-5 4 4 4-5 5 6"/></svg>
          <span>商品照片预览</span>
        </div>
        <figcaption>沿用真实商品照片，按各渠道尺寸排版。</figcaption>
      </figure>
    </section>

    <section id="facts" class="layout facts-layout" aria-labelledby="factsTitle" hidden>
      <form id="factsForm" class="panel stack" method="post" action="/api/launch/compose" aria-labelledby="factsTitle">
        <div><h2 id="factsTitle" tabindex="-1">核对商品信息</h2><p id="extractionSource"></p></div>
        <div class="fact-grid">
          <div class="field"><label for="name">商品名</label><input id="name" name="name" maxlength="36" aria-describedby="source-name" required><small id="source-name"></small></div>
          <div class="field"><label for="price">售价（元）</label><input type="text" inputmode="decimal" pattern="[0-9]{1,4}(\.[0-9]{1,2})?" id="price" name="price" aria-describedby="source-price" required><small id="source-price"></small></div>
          <div class="field"><label for="day">上新时间</label><input id="day" name="day" maxlength="32" placeholder="例如 周五或 11 月 28 日" aria-describedby="source-day" required><small id="source-day"></small></div>
          <fieldset class="field" aria-describedby="source-scope">
            <legend>销售范围</legend><div class="row pick"><label><input type="radio" name="scope" value="store" required>仅限堂食</label><label><input type="radio" name="scope" value="all">堂食和外卖</label></div><small id="source-scope"></small>
          </fieldset>
        </div>
        <div class="row"><button type="submit" class="primary">确认并制作物料</button><button type="button" id="back">返回素材</button></div>
      </form>
      <aside class="panel stack brief-side"><h3>原始备注</h3><blockquote id="originalNote"></blockquote><h3>计划制作</h3><p id="factPlan"></p></aside>
    </section>

    <section id="review" aria-labelledby="reviewTitle" hidden>
      <div class="review-heading">
        <div><h2 id="reviewTitle" tabindex="-1">渠道审稿台</h2><p id="planSource"></p></div>
        <a href="#actions" class="jump">修改或打包 ↓</a>
      </div>
      <div class="layout review-layout">
        <div class="stack">
          <div id="board" class="board" aria-label="渠道物料"></div>
          <p id="excluded" class="skip-note" hidden>已跳过外卖主图。此商品仅限堂食。</p>
        </div>
        <aside class="panel stack actions" id="actions">
          <div class="row action-heading"><h3>商品与版本</h3><span class="label" id="version"></span></div>
          <dl id="factSummary"></dl>
          <form id="change" class="stack" method="post" action="/api/launch/change" aria-labelledby="changeTitle">
            <h3 id="changeTitle">修改整套物料</h3>
            <div class="field"><label for="command">修改要求</label><textarea id="command" name="command" rows="2" maxlength="240" required placeholder="改成 26 元，周六再上"></textarea></div>
            <button type="submit">查看影响</button>
          </form>
          <div id="diff" class="diff stack" hidden>
            <h3>预计变更</h3><ul id="diffList"></ul><p id="diffImpact"></p>
            <div class="row"><button id="apply" type="button" class="primary">应用到整套</button><button id="dismiss" type="button">取消</button></div>
          </div>
          <div id="conflict" class="conflict" hidden></div>
          <p id="reviewNotice" class="notice" role="status"></p>
          <div class="row review-actions"><button id="approve" type="button" class="primary">确认本版并打包</button><button id="undo" type="button" hidden>撤销整套改动</button><button id="restart" type="button">开始下一款</button></div>
        </aside>
      </div>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="detailTitle">
    <form id="editCopy" class="stack" method="dialog" aria-labelledby="detailTitle">
      <div class="row action-heading"><h2 id="detailTitle"></h2><button id="closeDetail" type="button">关闭</button></div>
      <div id="previewSlot"></div>
      <p id="detailFacts"></p>
      <p id="detailConflict" class="conflict" role="status" hidden></p>
      <div class="field"><label for="copy">渠道文案</label><textarea id="copy" name="copy" rows="3" maxlength="280" required></textarea></div>
      <p id="detailStatus" class="notice" role="status"></p>
      <div class="row"><button type="submit" class="primary">保存并核对文案</button><button id="resetCopy" type="button">使用推荐文案</button><button id="downloadOne" type="button">下载此渠道 ZIP</button></div>
    </form>
  </dialog>
  <dialog id="newDraft" aria-labelledby="newDraftTitle">
    <form method="dialog" class="stack">
      <h2 id="newDraftTitle">开始下一款？</h2><p>此浏览器只保留一份工作草稿。需要留档时，请先下载当前版本。</p>
      <div class="row"><button value="cancel" autofocus>继续当前草稿</button><button class="primary" value="new">开始新草稿</button></div>
    </form>
  </dialog>
</body>
</html>
